version: "3.7"

services:
  backend:
    build:
      context: "./backend"
    environment:
      - SERVER_PORT=5000
      - VITE_API_URL=http://localhost:5000
      - VITE_URL=http://localhost:5173
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    command: npm run dev

  frontend:
    build:
      context: "./frontend"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
