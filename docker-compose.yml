version: "3.7"

services:
  backend:
    build:
      context: "./backend"
      target: dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    command: bun run dev

  frontend:
    build:
      context: "./frontend"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
